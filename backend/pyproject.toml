[project]
name = "talkback-backend"
version = "0.1.0"
description = "Talkback backend: Boson TTS/Realtime proxy, spoiler-safe retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "websockets>=13",
    "numpy>=2.0",
    "pyyaml>=6",
    "anthropic>=1.14.0",
    "rank-bm25>=0.2.2",
    "google-genai>=2.31.0",
    "google-auth>=2.62.0",
    "pymupdf>=1.28.2",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.1.0",
]
# the PDF engine behind PDF_ENGINE=pdfium (app/pdfdoc.py; Apache-2.0 / BSD-3-Clause, unlike pymupdf's AGPL)
pdfium = [
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
